<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>勉強アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="study-box">

        <div class="question">
            <h2>問題</h2>
            <p id="questionText">日本の首都はどこでしょう？</p>
            <button id="nextButton">次の問題</button>

        </div>

        <div class="answer">
            <h2>答え</h2>
            <p id="answerText">東京</p>
            <button id="answerButton">答えを出す</button>
        </div>

        <div>
            <button id="returnButton">最初に戻る</button>
        </div>
    </div>

    <script src="script.js"></script>

</body>

</html>
